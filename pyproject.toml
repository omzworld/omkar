[project]
name = "nba"
version = "0.1.0"
description = "Next best action engine for pharma omnichannel (MVP on synthetic data)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "typer>=0.12",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nba = "nba.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
